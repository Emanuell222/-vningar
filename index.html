<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gissa talet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🎯 Gissa talet</h1>

        <p>Jag tänker på ett tal mellan 1 och 100.</p>
        <p>Kan du gissa vilket?</p>

        <input type="number" id="guessInput" placeholder="Skriv din gissning">

        <button id="guessButton">Gissa</button>

        <p id="message">Skriv ett tal och tryck på Gissa!</p>

        <p>Antal försök: <span id="attempts">0</span></p>

        <button id="restartButton">Starta om</button>

    </div>

    <script src="logic.js"></script>

</body>

</html>
